services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: genieacs_platform
      POSTGRES_USER: genieacs
      POSTGRES_PASSWORD: genieacs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genieacs -d genieacs_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
